<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaMultiple</title>
  <meta name="description" content="FantaMultiple - gestione squadre, atleti e gare di prove multiple con punteggi World Athletics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a href="#home" class="brand">
      <span class="brand-mark">FM</span>
      <span class="brand-text">Fanta<b>Multiple</b></span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Apri menu">☰</button>
    <nav class="nav" id="nav">
      <a href="#home" data-route="home">Home</a>
      <a href="#squadre" data-route="squadre">Squadre</a>
      <a href="#atleti" data-route="atleti">Atleti</a>
      <a href="#gare" data-route="gare">Gare</a>
      <a href="#classifica" data-route="classifica">Classifica</a>
    </nav>
    <button class="btn btn-admin" id="adminBtn">🔒 Admin</button>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>FantaMultiple · punteggi calcolati con le tabelle World Athletics per le prove multiple</span>
      <div class="footer-actions">
        <button class="btn btn-ghost btn-sm" id="exportBtn">⬇ Esporta backup</button>
        <label class="btn btn-ghost btn-sm admin-only" id="importLabel">⬆ Importa backup
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
      </div>
    </div>
  </footer>

  <!-- Modale generica -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Chiudi">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
